<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#fbfaf5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="我的菜单" />
  <link rel="manifest" href="meal-planner.webmanifest" />
  <link rel="apple-touch-icon" href="meal-planner-icon.svg" />
  <title>我的每周菜单</title>
  <style>
    :root{--ink:#263126;--muted:#697368;--paper:#fbfaf5;--line:#e7e4d9;--green:#2f6b48;--sage:#e8f0e6;--warm:#f3ede1;--accent:#d96b4a;--shadow:0 14px 35px rgba(43,56,40,.08)}
    *{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 ui-rounded,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
    button,input,textarea,select{font:inherit} button{cursor:pointer;border:0;border-radius:10px;padding:9px 13px;background:var(--sage);color:var(--ink);font-weight:600} button:hover{filter:brightness(.97)} .primary{background:var(--green);color:white}.danger{color:#a23f2d;background:#fff0ec}.icon{padding:5px 8px;background:transparent;color:var(--muted)}
    header{max-width:1260px;margin:auto;padding:34px 24px 20px;display:flex;gap:20px;justify-content:space-between;align-items:flex-end}.eyebrow{letter-spacing:.12em;text-transform:uppercase;color:var(--green);font-size:12px;font-weight:700}h1{font-size:32px;line-height:1.15;margin:5px 0 0}h2{font-size:18px;margin:0}.week-nav{display:flex;gap:8px;align-items:center}.week-label{font-weight:700;min-width:148px;text-align:center}
    main{max-width:1260px;margin:auto;padding:0 24px 44px;display:grid;gap:22px}.calendar{display:grid;grid-template-columns:repeat(7,minmax(145px,1fr));gap:10px;overflow-x:auto;padding-bottom:5px}.day{background:white;border:1px solid var(--line);border-radius:16px;min-height:300px;padding:13px;display:flex;flex-direction:column;gap:11px}.today{border-color:#8ab298;box-shadow:0 0 0 2px #e7f0e7}.day-head{display:flex;justify-content:space-between;align-items:start}.dow{font-weight:700}.date{font-size:12px;color:var(--muted)}.meal{border-top:1px solid var(--line);padding-top:9px}.meal:first-of-type{border-top:0;padding-top:0}.meal-title{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-bottom:6px}.dish{width:100%;text-align:left;padding:7px 8px;margin:3px 0;background:var(--warm);font-weight:500;display:flex;justify-content:space-between;gap:6px}.dish small{color:var(--muted);font-weight:400;white-space:nowrap}.add-dish{margin-top:auto;width:100%;border:1px dashed #b8c7b7;background:white;color:var(--green)}
    .lower{display:grid;grid-template-columns:1.3fr .9fr;gap:22px}.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow)}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.library{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.recipe{border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer}.recipe:hover{border-color:#93af95}.recipe h3{font-size:15px;margin:0 0 3px}.recipe p{font-size:12px;color:var(--muted);margin:0}.recipe .tags{margin-top:8px;display:flex;gap:5px;flex-wrap:wrap}.tag{font-size:11px;background:var(--sage);padding:2px 7px;border-radius:20px}.shop-list{list-style:none;padding:0;margin:0}.shop-list li{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.shop-list li:last-child{border:0}.shop-list input{accent-color:var(--green)}.shop-list span{flex:1}.shop-list small{color:var(--muted)}.empty{color:var(--muted);font-size:14px;padding:14px 0}.modal{position:fixed;inset:0;background:rgba(29,38,28,.42);display:none;align-items:center;justify-content:center;padding:18px;z-index:3}.modal.show{display:flex}.dialog{background:var(--paper);width:min(570px,100%);max-height:92vh;overflow:auto;border-radius:18px;padding:24px;box-shadow:0 18px 60px #18221855}.dialog h2{margin-bottom:16px}.close{float:right}.fields{display:grid;gap:12px}.field{display:grid;gap:5px}.field label{font-size:13px;font-weight:600}.field input,.field textarea,.field select{border:1px solid #d6d8cf;border-radius:9px;padding:9px;background:white;width:100%}.field textarea{min-height:76px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.recipe-detail h3{margin-bottom:5px}.recipe-detail pre{white-space:pre-wrap;font:inherit;color:var(--muted);margin:10px 0}.delete-recipe{margin-right:auto}
    @media(max-width:800px){header{align-items:start;flex-direction:column;padding-top:24px}.calendar{grid-template-columns:repeat(7,155px);scroll-snap-type:x mandatory}.day{scroll-snap-align:start}.lower{grid-template-columns:1fr}.library{grid-template-columns:1fr}} @media(max-width:460px){header,main{padding-left:15px;padding-right:15px}.row{grid-template-columns:1fr}.week-nav{width:100%;justify-content:space-between}.week-label{min-width:0;font-size:13px}button{min-height:40px}.dish{min-height:38px}}
  </style>
</head>
<body>
  <header>
    <div><div class="eyebrow">Meal planning</div><h1>我的每周菜单</h1></div>
    <div class="week-nav"><button id="prevWeek" aria-label="上一周">←</button><div class="week-label" id="weekLabel"></div><button id="nextWeek" aria-label="下一周">→</button><button id="todayBtn">本周</button></div>
  </header>
  <main>
    <section class="calendar" id="calendar" aria-label="周历菜单"></section>
    <section class="lower">
      <div class="panel"><div class="panel-head"><h2>菜单库</h2><button class="primary" id="newRecipe">+ 新建菜谱</button></div><div class="library" id="library"></div></div>
      <div class="panel"><div class="panel-head"><h2>本周采购清单</h2><button id="clearChecks">清除勾选</button></div><ul class="shop-list" id="shopping"></ul></div>
    </section>
  </main>

  <div class="modal" id="dishModal" role="dialog" aria-modal="true" aria-labelledby="dishTitle"><div class="dialog"><button class="close icon" data-close>×</button><h2 id="dishTitle">安排菜色</h2><div class="fields"><div class="field"><label>选择已有菜谱</label><select id="dishSelect"></select></div><div class="field"><label>或输入新菜名</label><input id="dishName" placeholder="例如：番茄牛腩" /></div><div class="field"><label>餐次</label><select id="mealSelect"><option value="早餐">早餐</option><option value="午餐">午餐</option><option value="晚餐">晚餐</option></select></div></div><div class="actions"><button data-close>取消</button><button class="primary" id="saveDish">加入菜单</button></div></div></div>
  <div class="modal" id="recipeModal" role="dialog" aria-modal="true" aria-labelledby="recipeTitle"><div class="dialog"><button class="close icon" data-close>×</button><h2 id="recipeTitle">新建菜谱</h2><div class="fields"><div class="field"><label>粘贴整份菜谱（可选）</label><textarea id="recipePaste" placeholder="粘贴包含“主料 / 辅料 / 香料（或调料）/ 做法（或步骤）”的菜谱内容"></textarea><button id="parseRecipe">自动识别并填入</button></div><div class="field"><label>菜名</label><input id="recipeName" placeholder="例如：番茄牛腩" /></div><div class="row"><div class="field"><label>分类</label><input id="recipeCategory" placeholder="家常菜" /></div><div class="field"><label>份数</label><input id="recipeServings" placeholder="2 人份" /></div></div><div class="field"><label>食材（每行：食材, 数量）</label><textarea id="recipeIngredients" placeholder="【主料】&#10;牛腩, 500g&#10;番茄, 3 个&#10;【辅料】&#10;土豆, 2 个&#10;【香料 / 调料】&#10;盐, 适量"></textarea></div><div class="field"><label>做法</label><textarea id="recipeSteps" placeholder="可选：记录简单做法"></textarea></div></div><div class="actions"><button data-close>取消</button><button class="primary" id="saveRecipe">保存菜谱</button></div></div></div>
  <div class="modal" id="detailModal" role="dialog" aria-modal="true"><div class="dialog recipe-detail"><button class="close icon" data-close>×</button><div id="detailContent"></div></div></div>

  <script>
    const key='meal-planner-v1';
    const defaults={recipes:[
      {id:'r1',name:'番茄牛腩',category:'家常菜',servings:'2 人份',ingredients:[['牛腩','500g'],['番茄','3 个'],['土豆','2 个'],['洋葱','1 个']],steps:'牛腩焯水后炖软，加入蔬菜继续炖煮。'},
      {id:'r2',name:'清炒时蔬',category:'快手菜',servings:'2 人份',ingredients:[['青菜','400g'],['蒜','3 瓣']],steps:'蒜末爆香，放入青菜快速翻炒。'},
      {id:'r3',name:'三文鱼饭',category:'一人食',servings:'1 人份',ingredients:[['三文鱼','200g'],['米','150g'],['西兰花','1 颗']],steps:'三文鱼煎熟，配米饭和焯熟西兰花。'}],plans:{}};
    let state=JSON.parse(localStorage.getItem(key)||'null')||defaults, weekStart=startOfWeek(new Date()), selectedDate=null, editingRecipeId=null;
    const $=s=>document.querySelector(s), id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
    function save(){localStorage.setItem(key,JSON.stringify(state));render()}
    function startOfWeek(d){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-(x.getDay()+6)%7);return x}
    function dateKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
    function fmt(d,opts){return new Intl.DateTimeFormat('zh-CN',opts).format(d)}
    function dayPlan(k){return state.plans[k]||[]}
    function render(){renderCalendar();renderLibrary();renderShopping()}
    function renderCalendar(){const cal=$('#calendar');cal.innerHTML='';const end=new Date(weekStart);end.setDate(end.getDate()+6);$('#weekLabel').textContent=`${fmt(weekStart,{month:'long',day:'numeric'})} — ${fmt(end,{month:'long',day:'numeric'})}`;const today=dateKey(new Date());
      for(let i=0;i<7;i++){const d=new Date(weekStart);d.setDate(d.getDate()+i);const k=dateKey(d), card=document.createElement('article');card.className='day'+(k===today?' today':'');card.innerHTML=`<div class="day-head"><div><div class="dow">${fmt(d,{weekday:'short'})}</div><div class="date">${fmt(d,{month:'numeric',day:'numeric'})}</div></div><button class="icon" data-add="${k}" aria-label="添加菜色">＋</button></div>`;
        ['早餐','午餐','晚餐'].forEach(meal=>{const items=dayPlan(k).filter(x=>x.meal===meal);const el=document.createElement('div');el.className='meal';el.innerHTML=`<div class="meal-title"><span>${meal}</span>${items.length?`<span>${items.length} 道</span>`:''}</div>`;items.forEach(item=>{const recipe=state.recipes.find(r=>r.id===item.recipeId);const b=document.createElement('button');b.className='dish';b.innerHTML=`<span>${item.name}</span><small>×</small>`;b.title='点击移除';b.onclick=()=>{state.plans[k]=dayPlan(k).filter(x=>x.id!==item.id);save()};el.appendChild(b)});card.appendChild(el)});
        const add=document.createElement('button');add.className='add-dish';add.textContent='+ 添加菜色';add.onclick=()=>openDish(k);card.appendChild(add);cal.appendChild(card)} }
    function groupedIngredients(r){return r.ingredientGroups||{主料:r.ingredients||[]}}
    function flatIngredients(r){return Object.values(groupedIngredients(r)).flat()}
    function ingredientsText(r){return Object.entries(groupedIngredients(r)).map(([group,items])=>`【${group}】\n${items.map(x=>x.join(', ')).join('\n')}`).join('\n')}
    function renderLibrary(){const el=$('#library');el.innerHTML='';if(!state.recipes.length){el.innerHTML='<p class="empty">还没有菜谱，先新建一道吧。</p>';return}state.recipes.forEach(r=>{const x=document.createElement('article');x.className='recipe';x.innerHTML=`<h3>${esc(r.name)}</h3><p>${esc(r.category||'未分类')} · ${esc(r.servings||'份量未填')}</p><div class="tags">${flatIngredients(r).slice(0,3).map(a=>`<span class="tag">${esc(a[0])}</span>`).join('')}</div>`;x.onclick=()=>showDetail(r);el.appendChild(x)})}
    function renderShopping(){const all=[];for(let i=0;i<7;i++){const d=new Date(weekStart);d.setDate(d.getDate()+i);dayPlan(dateKey(d)).forEach(p=>{const r=state.recipes.find(x=>x.id===p.recipeId);if(r)flatIngredients(r).forEach(a=>all.push(a))})}const grouped={};all.forEach(([n,q])=>{grouped[n]=(grouped[n]||[]);grouped[n].push(q)});const el=$('#shopping');el.innerHTML='';const names=Object.keys(grouped);if(!names.length){el.innerHTML='<li class="empty">安排菜色后，这里会自动汇总所需食材。</li>';return}names.sort().forEach(n=>{const li=document.createElement('li');li.innerHTML=`<input type="checkbox" aria-label="购买 ${esc(n)}"><span>${esc(n)}</span><small>${grouped[n].join(' + ')}</small>`;el.appendChild(li)})}
    function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function openModal(sel){$(sel).classList.add('show')} function closeAll(){document.querySelectorAll('.modal').forEach(x=>x.classList.remove('show'))}
    function openDish(k){selectedDate=k;const select=$('#dishSelect');select.innerHTML='<option value="">从菜谱库选择</option>'+state.recipes.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('');$('#dishName').value='';$('#mealSelect').value='晚餐';openModal('#dishModal')}
    function showDetail(r){const groups=Object.entries(groupedIngredients(r)).map(([g,items])=>`<h3>${esc(g)}</h3><pre>${items.map(x=>esc(x.join('  ·  '))).join('\n')||'未填写'}</pre>`).join('');$('#detailContent').innerHTML=`<h2>${esc(r.name)}</h2><p class="text">${esc(r.category||'未分类')} · ${esc(r.servings||'份量未填')}</p>${groups}<h3>做法</h3><pre>${esc(r.steps||'未填写')}</pre><div class="actions"><button class="danger delete-recipe" data-id="${r.id}">删除菜谱</button><button class="edit-recipe" data-id="${r.id}">编辑菜谱</button><button data-close>关闭</button></div>`;openModal('#detailModal')}
    function parseIngredientGroups(text){let group='主料',groups={主料:[],辅料:[],'香料 / 调料':[]};text.split('\n').map(x=>x.trim()).filter(Boolean).forEach(line=>{const heading=line.replace(/[【】:#：]/g,'');if(/主料|食材/.test(heading)){group='主料';return}if(/辅料|配菜/.test(heading)){group='辅料';return}if(/香料|调料|调味/.test(heading)){group='香料 / 调料';return}if(/^\d+[.、]|步骤|做法/.test(line))return;const clean=line.replace(/^[-•*\d.、\s]+/,'');const [name,...rest]=clean.split(/[,，：:]/);if(name)groups[group].push([name.trim(),rest.join('').trim()||'适量'])});return Object.fromEntries(Object.entries(groups).filter(([,v])=>v.length))}
    function parseRecipePaste(){const raw=$('#recipePaste').value.trim();if(!raw)return alert('请先粘贴菜谱内容');const lines=raw.split('\n').map(x=>x.trim()).filter(Boolean);const title=lines.find(x=>!/(主料|辅料|香料|调料|做法|步骤|食材)/.test(x)&&x.length<30);if(title&&!$('#recipeName').value.trim())$('#recipeName').value=title.replace(/^#+\s*/,'');const stepAt=lines.findIndex(x=>/(做法|步骤)/.test(x));const ingredientPart=(stepAt<0?lines:lines.slice(0,stepAt)).filter(x=>x!==title).join('\n');const steps=stepAt<0?'':lines.slice(stepAt+1).join('\n');const groups=parseIngredientGroups(ingredientPart);$('#recipeIngredients').value=Object.entries(groups).map(([g,items])=>`【${g}】\n${items.map(x=>x.join(', ')).join('\n')}`).join('\n');if(steps)$('#recipeSteps').value=steps}
    function openRecipe(r=null){editingRecipeId=r?.id||null;$('#recipeTitle').textContent=r?'编辑菜谱':'新建菜谱';$('#recipePaste').value='';$('#recipeName').value=r?.name||'';$('#recipeCategory').value=r?.category||'';$('#recipeServings').value=r?.servings||'';$('#recipeIngredients').value=r?ingredientsText(r):'';$('#recipeSteps').value=r?.steps||'';openModal('#recipeModal')}
    $('#newRecipe').onclick=()=>openRecipe();$('#parseRecipe').onclick=parseRecipePaste;
    $('#saveRecipe').onclick=()=>{const name=$('#recipeName').value.trim();if(!name)return alert('请填写菜名');const groups=parseIngredientGroups($('#recipeIngredients').value);const data={name,category:$('#recipeCategory').value.trim(),servings:$('#recipeServings').value.trim(),ingredientGroups:groups,ingredients:Object.values(groups).flat(),steps:$('#recipeSteps').value.trim()};if(editingRecipeId){Object.assign(state.recipes.find(r=>r.id===editingRecipeId),data)}else state.recipes.unshift({id:id(),...data});closeAll();save()};
    $('#saveDish').onclick=()=>{let rid=$('#dishSelect').value,name=$('#dishName').value.trim();if(!rid&&!name)return alert('请选择或输入一道菜');let recipe=state.recipes.find(r=>r.id===rid);if(!recipe&&name){recipe={id:id(),name,category:'未分类',servings:'',ingredients:[],steps:''};state.recipes.unshift(recipe);rid=recipe.id}state.plans[selectedDate]??=[];state.plans[selectedDate].push({id:id(),meal:$('#mealSelect').value,recipeId:rid,name:recipe.name});closeAll();save()};
    document.addEventListener('click',e=>{if(e.target.matches('[data-close]')||e.target.classList.contains('modal'))closeAll();const add=e.target.closest('[data-add]');if(add)openDish(add.dataset.add);const edit=e.target.closest('.edit-recipe');if(edit){closeAll();openRecipe(state.recipes.find(r=>r.id===edit.dataset.id))}const del=e.target.closest('.delete-recipe');if(del){const rid=del.dataset.id;if(confirm('删除此菜谱？已安排的菜色会保留名称。')){state.recipes=state.recipes.filter(r=>r.id!==rid);closeAll();save()}}});
    $('#prevWeek').onclick=()=>{weekStart.setDate(weekStart.getDate()-7);render()};$('#nextWeek').onclick=()=>{weekStart.setDate(weekStart.getDate()+7);render()};$('#todayBtn').onclick=()=>{weekStart=startOfWeek(new Date());render()};$('#clearChecks').onclick=()=>document.querySelectorAll('#shopping input').forEach(x=>x.checked=false);render();
    if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('meal-planner-sw.js'));
  </script>
</body>
</html>
